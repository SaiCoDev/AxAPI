plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
}

group = 'com.artillexstudios.axapi'
version = property("version")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def java25NmsModules = ["v26_2"]

dependencies {
    compileOnly project(path: ":api")
    implementation project(path: ":folia")
    implementation project(path: ":paper")
    java25NmsModules.each {
        compileOnly(project(path: ":nms:$it")) {
            attributes {
                attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
            }
        }
    }
    implementation project(path: ":nms:v26_2", configuration: "reobf")
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'com.gradleup.shadow'

    compileJava {
        options.compilerArgs += ["-parameters"]
        options.encoding = "UTF-8"
        options.fork = true
    }

    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            name = 'Artillex-Studios'
            url = 'https://repo.artillex-studios.com/releases/'
        }

        maven {
            name = 'PaperMC'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }

        maven {
            name = 'PlaceholderAPI'
            url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
        }

        maven {
            name = 'JitPack'
            url = 'https://jitpack.io/'
        }
    }

    publishing {
        repositories {
            maven {
                name = "Enchanted"
                url = "https://maven.enchanted.dev/repository/maven-releases"
                credentials {
                    it.username = System.getenv("MAVEN_USERNAME") ?: findProperty("maven_username")
                    it.password = System.getenv("MAVEN_PASSWORD") ?: findProperty("maven_password")
                }
            }
        }

        afterEvaluate {
            // Only the root fat jar and the standalone API are consumable artifacts.
            // The nms modules are bundled into the root shadow jar, so they are not published.
            if (project != rootProject && project.name != "api") {
                return
            }

            publications {
                shadow(MavenPublication) { ->
                    groupId = "com.artillexstudios.axapi"
                    artifactId = project == rootProject ? "axapi" : "axapi-api"
                    from components.shadow

                    if (project.name == "api") {
                        artifact tasks.javadocJar
                    }
                }
            }
        }
    }

    publishToMavenLocal {
        dependsOn {
            build
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'net.kyori:adventure-text-minimessage:4.14.0'
        }
    }
}

shadowJar {
    from project(':api').sourceSets.main.output
    from project(':nms:v26_2').sourceSets.main.output
}

tasks.build.dependsOn(shadowJar)

tasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {
    relocate('dev.dejvokep.boostedyaml', 'com.artillexstudios.axapi.libs.boostedyaml')
    relocate('me.neznamy.yamlassist', 'com.artillexstudios.axapi.libs.yamlassist')
    relocate('org.apache.commons.math3', 'com.artillexstudios.axapi.libs.math3')
    relocate('com.github.benmanes', 'com.artillexstudios.axapi.libs.caffeine')
    relocate('org.yaml.snakeyaml', 'com.artillexstudios.axapi.libs.snakeyaml')
    relocate('com.zaxxer.hikari', 'com.artillexstudios.axapi.libs.hikari')
}

allprojects.forEach {
    it.afterEvaluate {
        println(it.name + " " + it.group + " " + it.version + " " + it.projectDir)
    }
}